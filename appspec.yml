version: 0.0

os: linux

files:
  - source: /
    destination: /var/www/html

file_exists_behavior: OVERWRITE

permissions:
  - object: /var/www/html
    pattern: "**"
    owner: www-data
    group: www-data
    mode: 755
    type:
      - file
      - directory

hooks:
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root